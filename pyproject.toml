[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rashi-harness"
version = "0.1.0"
description = "A coding-agent harness that closes every task by exit codes, not by the model's say-so"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.28,<1",
    "pydantic>=2.6,<3",
    "openai>=1.14,<3",
    "python-dotenv>=1.0.1,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rashi = "rashi.__main__:main"

[tool.setuptools]
packages = ["rashi"]

[tool.setuptools.package-data]
rashi = ["data/*"]
